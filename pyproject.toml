[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-re-agent-toolkit"
version = "0.1.0"
description = "Structured runtime discovery and probe generation for authorized Android reverse engineering."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Mobile RE Agent Toolkit contributors"}]
keywords = ["android", "reverse-engineering", "frida", "agent", "instrumentation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]

[project.scripts]
mrat = "mrat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[project.urls]
Repository = "https://github.com/ByMi1st/mobile-re-agent-toolkit"
Issues = "https://github.com/ByMi1st/mobile-re-agent-toolkit/issues"
